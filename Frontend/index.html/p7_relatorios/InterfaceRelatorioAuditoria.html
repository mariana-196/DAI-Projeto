<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Interface Relatório Auditoria</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f5f5f5;
        }

        h1 {
            color: #1f3c88;
        }

        .container {
            background-color: white;
            padding: 25px;
            border-radius: 8px;
            max-width: 1100px;
            margin: auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .campo {
            margin-bottom: 15px;
        }

        label {
            font-weight: bold;
            margin-right: 8px;
        }

        input, select {
            padding: 7px;
            margin-right: 15px;
        }

        button, .link-botao {
            padding: 9px 14px;
            margin-right: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background-color: #1f3c88;
            color: white;
            text-decoration: none;
            display: inline-block;
        }

        button:hover, .link-botao:hover {
            background-color: #162d66;
        }

        .erro {
            color: red;
            margin-top: 15px;
        }

        .resultado {
            margin-top: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 9px;
            text-align: left;
        }

        th {
            background-color: #1f3c88;
            color: white;
        }

        .filtros {
            margin-top: 20px;
            padding: 15px;
            background-color: #eef2ff;
            border-radius: 6px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Relatório de Auditoria</h1>

        <p>
            Interface para o Administrador extrair dados de segurança, aplicar filtros
            e visualizar os dados antes da exportação.
        </p>

        <a href="InterfaceRelatorioOperacional.html" class="link-botao">
            Ir para Relatório Operacional
        </a>

        <div class="campo" style="margin-top: 25px;">
            <label for="dataInicio">Data início:</label>
            <input type="date" id="dataInicio">

            <label for="dataFim">Data fim:</label>
            <input type="date" id="dataFim">
        </div>

        <div class="filtros">
            <h3>Filtros de Segurança</h3>

            <label for="utilizador">Utilizador:</label>
            <input type="text" id="utilizador" placeholder="Ex: admin">

            <label for="severidade">Severidade:</label>
            <select id="severidade">
                <option value="">Todas</option>
                <option value="INFO">INFO</option>
                <option value="AVISO">AVISO</option>
                <option value="ERRO">ERRO</option>
                <option value="CRITICO">CRÍTICO</option>
            </select>

            <label for="evento">Evento:</label>
            <input type="text" id="evento" placeholder="Ex: LOGIN">
        </div>

        <div class="campo" style="margin-top: 20px;">
            <button onclick="gerarRelatorioAuditoria()">Gerar Relatório</button>
            <button onclick="exportarPDF()">Exportar PDF</button>
            <button onclick="limparFiltros()">Limpar</button>
        </div>

        <div id="erro" class="erro"></div>

        <div id="resultado" class="resultado"></div>
    </div>

    <script>
        const API_URL = "http://localhost:8081/api/relatorios";

        function obterValor(id) {
            return document.getElementById(id).value || "";
        }

        async function gerarRelatorioAuditoria() {
            document.getElementById("erro").innerText = "";
            document.getElementById("resultado").innerHTML = "A gerar relatório...";

            const parametros = new URLSearchParams({
                dataInicio: obterValor("dataInicio"),
                dataFim: obterValor("dataFim"),
                utilizador: obterValor("utilizador"),
                severidade: obterValor("severidade"),
                evento: obterValor("evento")
            });

            try {
                const resposta = await fetch(`${API_URL}/auditoria?${parametros.toString()}`, {
                    method: "POST"
                });

                if (!resposta.ok) {
                    const mensagemErro = await resposta.text();
                    throw new Error(mensagemErro || "Erro ao gerar relatório de auditoria.");
                }

                const relatorio = await resposta.json();
                mostrarRelatorio(relatorio);

            } catch (error) {
                document.getElementById("resultado").innerHTML = "";
                document.getElementById("erro").innerText = error.message;
            }
        }

        function mostrarRelatorio(relatorio) {
            const resultado = document.getElementById("resultado");

            let html = `
                <h2>${relatorio.titulo}</h2>
                <p><strong>Tipo:</strong> ${relatorio.tipo}</p>
                <p><strong>Gerado em:</strong> ${relatorio.geradoEm}</p>
                <p><strong>Gerado por:</strong> ${relatorio.geradoPor}</p>
                <h3>Pré-visualização</h3>
            `;

            if (!relatorio.dados || relatorio.dados.length === 0) {
                html += "<p>Sem dados disponíveis.</p>";
                resultado.innerHTML = html;
                return;
            }

            const colunas = Object.keys(relatorio.dados[0]);

            html += "<table>";
            html += "<thead><tr>";

            colunas.forEach(coluna => {
                html += `<th>${coluna}</th>`;
            });

            html += "</tr></thead><tbody>";

            relatorio.dados.forEach(linha => {
                html += "<tr>";

                colunas.forEach(coluna => {
                    html += `<td>${linha[coluna] ?? ""}</td>`;
                });

                html += "</tr>";
            });

            html += "</tbody></table>";

            resultado.innerHTML = html;
        }

        async function exportarPDF() {
            document.getElementById("erro").innerText = "";

            try {
                const resposta = await fetch(`${API_URL}/exportar/pdf`, {
                    method: "POST"
                });

                if (!resposta.ok) {
                    const mensagemErro = await resposta.text();
                    throw new Error(mensagemErro || "Erro ao exportar PDF.");
                }

                const ficheiroPDF = await resposta.json();

                const byteCharacters = atob(ficheiroPDF.conteudoBase64);
                const byteNumbers = new Array(byteCharacters.length);

                for (let i = 0; i < byteCharacters.length; i++) {
                    byteNumbers[i] = byteCharacters.charCodeAt(i);
                }

                const byteArray = new Uint8Array(byteNumbers);
                const blob = new Blob([byteArray], { type: ficheiroPDF.tipoConteudo });

                const url = window.URL.createObjectURL(blob);
                const link = document.createElement("a");

                link.href = url;
                link.download = ficheiroPDF.nomeFicheiro || "relatorio_auditoria.pdf";

                document.body.appendChild(link);
                link.click();
                link.remove();

                window.URL.revokeObjectURL(url);

            } catch (error) {
                document.getElementById("erro").innerText = error.message;
            }
        }

        function limparFiltros() {
            document.getElementById("dataInicio").value = "";
            document.getElementById("dataFim").value = "";
            document.getElementById("utilizador").value = "";
            document.getElementById("severidade").value = "";
            document.getElementById("evento").value = "";
            document.getElementById("resultado").innerHTML = "";
            document.getElementById("erro").innerText = "";
        }
    </script>
</body>
</html>
