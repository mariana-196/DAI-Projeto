<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Interface Relatório Operacional</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f5f5f5;
        }

        h1 {
            color: #1f3c88;
        }

        .container {
            background-color: white;
            padding: 25px;
            border-radius: 8px;
            max-width: 1100px;
            margin: auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .campo {
            margin-bottom: 15px;
        }

        label {
            font-weight: bold;
            margin-right: 8px;
        }

        input {
            padding: 7px;
            margin-right: 15px;
        }

        button, .link-botao {
            padding: 9px 14px;
            margin-right: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background-color: #1f3c88;
            color: white;
            text-decoration: none;
            display: inline-block;
        }

        button:hover, .link-botao:hover {
            background-color: #162d66;
        }

        .erro {
            color: red;
            margin-top: 15px;
        }

        .resultado {
            margin-top: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 9px;
            text-align: left;
        }

        th {
            background-color: #1f3c88;
            color: white;
        }

        .filtros {
            margin-top: 20px;
            padding: 15px;
            background-color: #eef2ff;
            border-radius: 6px;
        }

        .grafico {
            margin-top: 20px;
            padding: 15px;
            background-color: #e8f5e9;
            border-radius: 6px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Relatório Operacional</h1>

        <p>
            Interface para configurar filtros de linhas, veículos, paragens e horários,
            permitindo consultar métricas operacionais.
        </p>

        <a href="InterfaceRelatorioAuditoria.html" class="link-botao">
            Ir para Relatório de Auditoria
        </a>

        <div class="campo" style="margin-top: 25px;">
            <label for="dataInicio">Data início:</label>
            <input type="date" id="dataInicio">

            <label for="dataFim">Data fim:</label>
            <input type="date" id="dataFim">
        </div>

        <div class="filtros">
            <h3>Filtros de Negócio</h3>

            <label for="linha">Linha:</label>
            <input type="text" id="linha" placeholder="Ex: 43">

            <label for="veiculo">Veículo:</label>
            <input type="text" id="veiculo" placeholder="Ex: BUS-102">

            <label for="paragem">Paragem:</label>
            <input type="text" id="paragem" placeholder="Ex: Universidade">
        </div>

        <div class="campo" style="margin-top: 20px;">
            <button onclick="gerarRelatorioOperacional()">Gerar Relatório</button>
            <button onclick="exportarPDF()">Exportar PDF</button>
            <button onclick="limparFiltros()">Limpar</button>
        </div>

        <div id="erro" class="erro"></div>

        <div id="resultado" class="resultado"></div>
    </div>

    <script>
        const API_URL = "http://localhost:8081/api/relatorios";

        function obterValor(id) {
            return document.getElementById(id).value || "";
        }

        async function gerarRelatorioOperacional() {
            document.getElementById("erro").innerText = "";
            document.getElementById("resultado").innerHTML = "A gerar relatório...";

            const parametros = new URLSearchParams({
                dataInicio: obterValor("dataInicio"),
                dataFim: obterValor("dataFim"),
                linha: obterValor("linha"),
                veiculo: obterValor("veiculo"),
                paragem: obterValor("paragem")
            });

            try {
                const resposta = await fetch(`${API_URL}/operacional?${parametros.toString()}`, {
                    method: "POST"
                });

                if (!resposta.ok) {
                    const mensagemErro = await resposta.text();
                    throw new Error(mensagemErro || "Erro ao gerar relatório operacional.");
                }

                const relatorio = await resposta.json();
                mostrarRelatorio(relatorio);

            } catch (error) {
                document.getElementById("resultado").innerHTML = "";
                document.getElementById("erro").innerText = error.message;
            }
        }

        function mostrarRelatorio(relatorio) {
            const resultado = document.getElementById("resultado");

            let html = `
                <h2>${relatorio.titulo}</h2>
                <p><strong>Tipo:</strong> ${relatorio.tipo}</p>
                <p><strong>Gerado em:</strong> ${relatorio.geradoEm}</p>
                <p><strong>Gerado por:</strong> ${relatorio.geradoPor}</p>
                <h3>Pré-visualização</h3>
            `;

            if (!relatorio.dados || relatorio.dados.length === 0) {
                html += "<p>Sem dados disponíveis.</p>";
                resultado.innerHTML = html;
                return;
            }

            const linhasTabela = relatorio.dados.filter(item => !item.tipoGrafico);
            const dadosGrafico = relatorio.dados.find(item => item.tipoGrafico);

            if (linhasTabela.length > 0) {
                const colunas = Object.keys(linhasTabela[0]);

                html += "<table>";
                html += "<thead><tr>";

                colunas.forEach(coluna => {
                    html += `<th>${coluna}</th>`;
                });

                html += "</tr></thead><tbody>";

                linhasTabela.forEach(linha => {
                    html += "<tr>";

                    colunas.forEach(coluna => {
                        html += `<td>${linha[coluna] ?? ""}</td>`;
                    });

                    html += "</tr>";
                });

                html += "</tbody></table>";
            }

            if (dadosGrafico) {
                html += `
                    <div class="grafico">
                        <h3>Resumo Gráfico</h3>
                        <p><strong>Tipo de gráfico:</strong> ${dadosGrafico.tipoGrafico}</p>
                        <p><strong>Descrição:</strong> ${dadosGrafico.descricao}</p>
                        <p><strong>Total de passageiros:</strong> ${dadosGrafico.totalPassageiros}</p>
                        <p><strong>Lotação média:</strong> ${dadosGrafico.lotacaoMedia}</p>
                    </div>
                `;
            }

            resultado.innerHTML = html;
        }

        async function exportarPDF() {
            document.getElementById("erro").innerText = "";

            try {
                const resposta = await fetch(`${API_URL}/exportar/pdf`, {
                    method: "POST"
                });

                if (!resposta.ok) {
                    const mensagemErro = await resposta.text();
                    throw new Error(mensagemErro || "Erro ao exportar PDF.");
                }

                const ficheiroPDF = await resposta.json();

                const byteCharacters = atob(ficheiroPDF.conteudoBase64);
                const byteNumbers = new Array(byteCharacters.length);

                for (let i = 0; i < byteCharacters.length; i++) {
                    byteNumbers[i] = byteCharacters.charCodeAt(i);
                }

                const byteArray = new Uint8Array(byteNumbers);
                const blob = new Blob([byteArray], { type: ficheiroPDF.tipoConteudo });

                const url = window.URL.createObjectURL(blob);
                const link = document.createElement("a");

                link.href = url;
                link.download = ficheiroPDF.nomeFicheiro || "relatorio_operacional.pdf";

                document.body.appendChild(link);
                link.click();
                link.remove();

                window.URL.revokeObjectURL(url);

            } catch (error) {
                document.getElementById("erro").innerText = error.message;
            }
        }

        function limparFiltros() {
            document.getElementById("dataInicio").value = "";
            document.getElementById("dataFim").value = "";
            document.getElementById("linha").value = "";
            document.getElementById("veiculo").value = "";
            document.getElementById("paragem").value = "";
            document.getElementById("resultado").innerHTML = "";
            document.getElementById("erro").innerText = "";
        }
    </script>
</body>
</html>
