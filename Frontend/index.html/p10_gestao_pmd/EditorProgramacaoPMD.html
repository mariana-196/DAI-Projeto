<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Editor de Programação PMD - TUB</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #0D47A1;
            --bg-color: #f1f5f9;
            --text-main: #1e293b;
            --border-light: #e2e8f0;
        }

        body { font-family: 'Inter', sans-serif; margin: 0; background-color: var(--bg-color); padding: 30px; }

        .card-agendar {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            border: 1px solid var(--border-light);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            overflow: hidden;
        }

        .card-header {
            background: linear-gradient(135deg, var(--primary) 0%, #1e3a8a 100%);
            color: white;
            padding: 20px 25px;
        }

        .card-header h3 { margin: 0; font-size: 18px; display: flex; align-items: center; gap: 10px; }

        .card-body { padding: 25px; }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .full-width { grid-column: span 2; }

        label { 
            font-size: 12px; 
            font-weight: 700; 
            color: #64748b; 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
        }

        input, select, textarea {
            padding: 12px;
            border: 1px solid var(--border-light);
            border-radius: 10px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
        }

        input:focus, select:focus { border-color: var(--primary); }

        .btn-save {
            background: #10b981;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.2s;
        }

        .btn-save:hover { background: #059669; transform: translateY(-1px); }

        .agenda-preview {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px dashed var(--border-light);
        }
    </style>
</head>
<body>

    <div class="card-agendar">
        <div class="card-header">
            <h3><i class="fa-solid fa-calendar-check"></i> Agendamento de Mensagens (DMS)</h3>
        </div>

        <div class="card-body">
            <div class="form-grid">
                <div class="form-group full-width">
                    <label>Mensagem a Programar</label>
                    <select id="select-mensagem">
                        <option value="">Selecione uma mensagem guardada...</option>
                        <option value="1">Aviso: Greve Nacional (Amanhã)</option>
                        <option value="2">Info: Reforço Linha 43 (Estádio)</option>
                        <option value="3">Alerta: Rua do Souto Cortada</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Data de Exibição</label>
                    <input type="date" id="data-exibicao">
                </div>

                <div class="form-group">
                    <label>Hora de Início</label>
                    <input type="time" id="hora-exibicao">
                </div>

                <div class="form-group">
                    <label>Duração (Minutos)</label>
                    <input type="number" id="duracao" placeholder="Ex: 60" min="1">
                </div>

                <div class="form-group">
                    <label>Prioridade</label>
                    <select id="prioridade">
                        <option value="NORMAL">Normal</option>
                        <option value="ALTA">Alta</option>
                        <option value="URGENTE">Urgente</option>
                    </select>
                </div>
            </div>

            <button class="btn-save" onclick="salvarAgendamento()">
                <i class="fa-solid fa-floppy-disk"></i> GUARDAR PROGRAMAÇÃO
            </button>

            <div class="agenda-preview" id="preview-container" style="display:none;">
                <label>Estado do Agendamento:</label>
                <p id="msg-confirmacao" style="color: #059669; font-size: 14px; font-weight: 500;"></p>
            </div>
        </div>
    </div>

    <script>
        function salvarAgendamento() {
            const data = document.getElementById('data-exibicao').value;
            const hora = document.getElementById('hora-exibicao').value;
            
            if(!data || !hora) {
                alert("Preencha a data e a hora primeiro!");
                return;
            }

            // Simulação de envio para o RepositorioTarefasExibidas
            const preview = document.getElementById('preview-container');
            const msg = document.getElementById('msg-confirmacao');
            
            preview.style.display = 'block';
            msg.innerHTML = `<i class="fa-solid fa-circle-check"></i> Tarefa agendada para ${data} às ${hora}. O Processador de Validação Temporal irá ativá-la no momento certo.`;
            
            // Limpar formulário após 3 segundos
            setTimeout(() => {
                preview.style.display = 'none';
            }, 5000);
        }
    </script>
</body>
</html>
