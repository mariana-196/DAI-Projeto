<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Publicar Mensagem PMD - TUB</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #0D47A1;
            --primary-hover: #002171;
            --bg-color: #f1f5f9;
            --text-main: #1e293b;
            --border-light: #e2e8f0;
        }

        body { font-family: 'Inter', sans-serif; margin: 0; background-color: var(--bg-color); color: var(--text-main); padding: 30px; }

        .card-publicar {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            border: 1px solid var(--border-light);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            overflow: hidden;
        }

        .card-header {
            background: linear-gradient(135deg, var(--primary) 0%, #1e3a8a 100%);
            color: white;
            padding: 20px 25px;
        }

        .card-header h3 { margin: 0; font-size: 18px; display: flex; align-items: center; gap: 10px; }

        .card-body { padding: 25px; }

        .form-group { margin-bottom: 20px; }

        label { 
            display: block; 
            font-size: 13px; 
            font-weight: 600; 
            color: #64748b; 
            text-transform: uppercase; 
            margin-bottom: 8px; 
        }

        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-light);
            border-radius: 10px;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
            min-height: 100px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus { border-color: var(--primary); }

        .panel-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            background: #f8fafc;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid var(--border-light);
        }

        .checkbox-item { display: flex; align-items: center; gap: 8px; font-size: 14px; }

        .btn-enviar {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-enviar:hover { background: var(--primary-hover); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(13, 71, 161, 0.2); }

        .alerta-sucesso {
            display: none;
            background: #ecfdf5;
            color: #047857;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #a7f3d0;
            margin-top: 20px;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="card-publicar">
        <div class="card-header">
            <h3><i class="fa-solid fa-paper-plane"></i> Publicação Imediata PMD</h3>
        </div>
        
        <div class="card-body">
            <div class="form-group">
                <label>Mensagem para Exibição</label>
                <textarea id="texto-mensagem" placeholder="Escreva aqui o aviso que aparecerá nos ecrãs..."></textarea>
            </div>

            <div class="form-group">
                <label>Selecionar Painéis de Destino</label>
                <div class="panel-selector">
                    <div class="checkbox-item"><input type="checkbox" checked> Todos os Painéis</div>
                    <div class="checkbox-item"><input type="checkbox"> Terminal Rodoviário</div>
                    <div class="checkbox-item"><input type="checkbox"> Estação CP</div>
                    <div class="checkbox-item"><input type="checkbox"> Praça da República</div>
                </div>
            </div>

            <button class="btn-enviar" onclick="enviarMensagem()">
                <i class="fa-solid fa-broadcast-tower"></i> PUBLICAR NOS PAINÉIS
            </button>

            <div id="msg-sucesso" class="alerta-sucesso">
                <i class="fa-solid fa-check-circle"></i> Mensagem enviada com sucesso para o Controlador!
            </div>
        </div>
    </div>

    <script>
        async function enviarMensagem() {
            const texto = document.getElementById('texto-mensagem').value;
            if(!texto) { alert("Escreve uma mensagem primeiro, mano!"); return; }

            // Simulação de chamada ao ControladorPublicacaoMensagem
            console.log("A enviar para o Controlador:", texto);
            
            // Mostrar feedback visual
            document.getElementById('msg-sucesso').style.display = 'block';
            document.getElementById('texto-mensagem').value = '';
            
            setTimeout(() => {
                document.getElementById('msg-sucesso').style.display = 'none';
            }, 4000);
        }
    </script>
</body>
</html>
