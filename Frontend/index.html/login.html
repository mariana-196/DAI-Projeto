<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TUB – Autenticação</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared/style.css">
</head>
<body>
    <div id="page-login">
        <div class="login-logo">
            <div class="logo-mark" style="background: #ffffff; padding: 12px 24px; border-radius: 14px; box-shadow: var(--shadow-md); border: none;">
                <img src="images/image_tub.png" alt="TUB" style="height: 52px; display: block;">
            </div>
            <p style="color: rgba(255,255,255,.8); font-weight: 500; letter-spacing: 1px;">TRANSPORTES URBANOS DE BRAGA</p>
        </div>
        
        <div class="login-card">
            <h2>Bem-vindo</h2>
            <p class="sub">Aceda à Plataforma de Gestão Urbana TUB</p>
            
            <div id="login-error-banner" class="annotation-box" style="display:none; background:#FDECEC; border-color:#B51C1C; color:#B51C1C;">
                <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                </svg>
                <span id="login-error-message">Erro de autenticação</span>
            </div>

            <div id="form-login-local">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="login-email" placeholder="utilizador@tub.pt">
                </div>
                <div class="form-group">
                    <label>Palavra-passe</label>
                    <div class="input-wrap">
                        <input type="password" id="login-password" placeholder="••••••••">
                        <button class="eye-btn" id="toggle-pwd-btn" title="Mostrar/ocultar password">
                            <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                            </svg>
                        </button>
                    </div>
                </div>
                
                <button class="btn-primary" id="btn-login-local">
                    Entrar na Plataforma
                </button>
            </div>


        </div>
        
        <p class="login-footer">Plataforma TUB v2.0 &nbsp;·&nbsp; © 2026 Transportes Urbanos de Braga</p>
    </div>

    <script src="shared/api.js"></script>
    <script>
        // Password Visibility Toggle
        const pwdInput = document.getElementById("login-password");
        const togglePwdBtn = document.getElementById("toggle-pwd-btn");
        togglePwdBtn.addEventListener("click", () => {
            if (pwdInput.type === "password") {
                pwdInput.type = "text";
            } else {
                pwdInput.type = "password";
            }
        });



        // Error helper
        function showError(msg) {
            const banner = document.getElementById("login-error-banner");
            const span = document.getElementById("login-error-message");
            span.textContent = msg;
            banner.style.display = "flex";
        }

        // Handle Local Login
        document.getElementById("btn-login-local").addEventListener("click", async () => {
            const email = document.getElementById("login-email").value;
            const password = document.getElementById("login-password").value;
            document.getElementById("login-error-banner").style.display = "none";

            try {
                const resp = await fetch("http://localhost:8081/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                const response = await resp.json();

                if (resp.ok && response.token && response.utilizador) {
                    sessionStorage.setItem("user_token", response.token);
                    sessionStorage.setItem("user_id", response.utilizador.id);
                    sessionStorage.setItem("user_name", response.utilizador.nome);
                    sessionStorage.setItem("user_email", response.utilizador.email);
                    sessionStorage.setItem("user_role", response.utilizador.cargo);
                    window.location.href = "dashboard.html";
                } else {
                    const msg = response.mensagem || "Falha na autenticação!";
                    const bloqueada = msg.toLowerCase().includes("bloqueada") || msg.toLowerCase().includes("inativo");
                    if (bloqueada) {
                        showError("🔒 Conta bloqueada. Contacte o administrador.");
                    } else {
                        showError("Credenciais inválidas. Verifique o email e a palavra-passe.");
                    }
                }
            } catch (err) {
                showError("Não foi possível ligar ao servidor. Verifique a ligação.");
            }
        });


    </script>
</body>
</html>
