<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TUB – Autenticação</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared/style.css">
</head>
<body>
    <div id="page-login">
        <div class="login-logo">
            <div class="logo-mark">
                <span class="logo-t">T<span>U</span>B</span>
            </div>
            <p>TRANSPORTES URBANOS DE BRAGA</p>
        </div>
        
        <div class="login-card">
            <h2>Bem-vindo</h2>
            <p class="sub">Aceda à Plataforma de Gestão Urbana TUB</p>
            
            <div id="login-error-banner" class="annotation-box" style="display:none; background:#FDECEC; border-color:#B51C1C; color:#B51C1C;">
                <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                </svg>
                <span id="login-error-message">Erro de autenticação</span>
            </div>

            <div id="form-login-local">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="login-email" placeholder="utilizador@tub.pt" value="admin@tub.pt">
                </div>
                <div class="form-group">
                    <label>Palavra-passe</label>
                    <div class="input-wrap">
                        <input type="password" id="login-password" placeholder="••••••••" value="1234">
                        <button class="eye-btn" id="toggle-pwd-btn" title="Mostrar/ocultar password">
                            <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                            </svg>
                        </button>
                    </div>
                </div>
                
                <button class="btn-primary" id="btn-login-local">
                    Entrar na Plataforma
                </button>
            </div>

            <div id="form-login-gov" style="display:none; margin-bottom: 18px;">
                <div class="form-group">
                    <label>Email Associado</label>
                    <input type="email" id="gov-email" placeholder="nome@email.com">
                </div>
                <div class="form-group">
                    <label>Código CMD (SMS / App)</label>
                    <input type="text" id="gov-code" placeholder="Introduza o código recebido">
                </div>
                <button class="btn-primary" id="btn-submit-gov">
                    Confirmar Autenticação
                </button>
                <button class="btn btn-outline" id="btn-cancel-gov" style="width:100%; justify-content:center;">
                    Voltar ao Login local
                </button>
            </div>
            
            <div class="divider" id="divider-gov">
                <span></span>
                <p>ou</p>
                <span></span>
            </div>
            
            <button class="btn-secondary" id="btn-login-gov">
                <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                </svg>
                Entrar com Autenticação.gov (CMD)
            </button>
        </div>
        
        <p class="login-footer">Plataforma TUB v2.0 &nbsp;·&nbsp; © 2026 Transportes Urbanos de Braga</p>
    </div>

    <script src="shared/api.js"></script>
    <script>
        // Password Visibility Toggle
        const pwdInput = document.getElementById("login-password");
        const togglePwdBtn = document.getElementById("toggle-pwd-btn");
        togglePwdBtn.addEventListener("click", () => {
            if (pwdInput.type === "password") {
                pwdInput.type = "text";
            } else {
                pwdInput.type = "password";
            }
        });

        // Switch between Local & CMD
        const btnLoginGov = document.getElementById("btn-login-gov");
        const btnCancelGov = document.getElementById("btn-cancel-gov");
        const localForm = document.getElementById("form-login-local");
        const govForm = document.getElementById("form-login-gov");
        const dividerGov = document.getElementById("divider-gov");

        btnLoginGov.addEventListener("click", () => {
            localForm.style.display = "none";
            btnLoginGov.style.display = "none";
            dividerGov.style.display = "none";
            govForm.style.display = "block";
            document.getElementById("login-error-banner").style.display = "none";
        });

        btnCancelGov.addEventListener("click", () => {
            govForm.style.display = "none";
            localForm.style.display = "block";
            btnLoginGov.style.display = "block";
            dividerGov.style.display = "flex";
            document.getElementById("login-error-banner").style.display = "none";
        });

        // Error helper
        function showError(msg) {
            const banner = document.getElementById("login-error-banner");
            const span = document.getElementById("login-error-message");
            span.textContent = msg;
            banner.style.display = "flex";
        }

        // Handle Local Login
        document.getElementById("btn-login-local").addEventListener("click", async () => {
            const email = document.getElementById("login-email").value;
            const password = document.getElementById("login-password").value;
            document.getElementById("login-error-banner").style.display = "none";

            try {
                const response = await apiPost("/api/auth/login", { email, password });
                if (response.token && response.utilizador) {
                    sessionStorage.setItem("user_token", response.token);
                    sessionStorage.setItem("user_name", response.utilizador.nome);
                    sessionStorage.setItem("user_email", response.utilizador.email);
                    sessionStorage.setItem("user_role", response.utilizador.cargo);
                    window.location.href = "dashboard.html";
                } else {
                    showError(response.mensagem || "Falha na autenticação!");
                }
            } catch (err) {
                showError("Credenciais inválidas ou utilizador inativo!");
            }
        });

        // Handle Gov Login
        document.getElementById("btn-submit-gov").addEventListener("click", async () => {
            const email = document.getElementById("gov-email").value;
            const codigoGov = document.getElementById("gov-code").value;
            document.getElementById("login-error-banner").style.display = "none";

            if (!email || !codigoGov) {
                showError("Por favor, introduza o email e o código!");
                return;
            }

            try {
                const response = await apiPost("/api/auth/login-gov", { email, codigoGov });
                if (response.token && response.utilizador) {
                    sessionStorage.setItem("user_token", response.token);
                    sessionStorage.setItem("user_name", response.utilizador.nome);
                    sessionStorage.setItem("user_email", response.utilizador.email);
                    sessionStorage.setItem("user_role", response.utilizador.cargo);
                    window.location.href = "dashboard.html";
                } else {
                    showError(response.mensagem || "Falha na autenticação CMD!");
                }
            } catch (err) {
                showError("Autenticação CMD falhou ou utilizador não registado!");
            }
        });
    </script>
</body>
</html>
