spring.datasource.url=jdbc:mysql://localhost:3307/tub_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=tub_user
spring.datasource.password=tub_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Comunicacao segura entre frontend e backend.
# Em desenvolvimento usa um certificado local autoassinado. Em producao,
# substituir por um certificado emitido pela organizacao/entidade certificadora.
server.port=${SERVER_PORT:8443}
server.ssl.enabled=${SERVER_SSL_ENABLED:true}
server.ssl.key-store=${SERVER_SSL_KEY_STORE:classpath:certs/tub-local.p12}
server.ssl.key-store-password=${SERVER_SSL_KEY_STORE_PASSWORD:tub_local_dev_password}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=${SERVER_SSL_KEY_ALIAS:tub-local}
